[workspace]
resolver = "2"
members = [
	"src/core",
	"src/cli",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Acture <acturea@gmail.com>"]
repository = "https://github.com/Acture/ScriptMark"
homepage = "https://github.com/Acture/ScriptMark"
keywords = ["grading", "education", "autograding", "cli"]
categories = ["command-line-utilities"]
readme = "README.md"

[workspace.dependencies]
scriptmark-core = { path = "src/core", version = "0.3.0" }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
csv = "1"

# Async
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Scripting
rhai = "1"

# Display
comfy-table = "7"
owo-colors = "4"

# Error handling
thiserror = "2"
anyhow = "1"

# Regex
regex = "1"

# Archive
zip = { version = "8", default-features = false, features = ["deflate"] }

# System
libc = "0.2"

# Random
rand = "0.9"
rand_chacha = "0.9"

ratatui = "0.29"
crossterm = "0.29"
rusqlite = { version = "0.34", features = ["bundled"] }
